<template rust:component="ConnectionCredentials">
  <section class="connection-screen">
    <div class="connection-form">
      <h2 class="connection-title">{{ state.terminal.draft.name.get() }}</h2>
      <p class="connection-hint">{{ state.terminal.address.get() }}</p>
      <p>Enter the {{ state.client.profile().secret.noun }} for this connection.</p>
      <ConnectionSecret terminal="{{ state.terminal.clone() }}"
                        client="{{ state.client }}"></ConnectionSecret>
      <p id="connection-error" class="error">{{ state.terminal.connection_error.get() }}</p>
      <div class="connection-actions">
        <button id="connect" class="primary"
                on:click="state.terminal.connect()">Open workspace →</button>
        <button on:click="state.terminal.leave_connection()">Cancel  Esc</button>
      </div>
    </div>
  </section>
</template>
