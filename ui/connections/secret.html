<template rust:component="ConnectionSecret">
  <div>
    <label for="connection-secret">{{ state.client.profile().secret.label }}</label>
    <If condition="{{ state.client.profile().secret.multiline }}">
      <textarea id="connection-secret" class="connection-lines" autofocus bind="state.terminal.secret"
                readonly="{{ matches!(state.terminal.draft.purpose.get(), ConnectionPurpose::Current) }}"
                class:placeholder="{{ state.terminal.secret.with(String::is_empty) }}"
                on:focus="state.terminal.remember_focus(&event)"
                placeholder="{{ state.client.profile().secret.placeholder }}"></textarea>
    </If>
    <If condition="{{ !state.client.profile().secret.multiline }}">
      <input id="connection-secret" autofocus bind="state.terminal.secret"
             readonly="{{ matches!(state.terminal.draft.purpose.get(), ConnectionPurpose::Current) }}"
             class:placeholder="{{ state.terminal.secret.with(String::is_empty) }}"
             on:focus="state.terminal.remember_focus(&event)"
             placeholder="{{ state.client.profile().secret.placeholder }}">
    </If>
    <p class="connection-hint">{{ state.client.profile().secret.hint }}</p>
    <If condition="{{ matches!(state.terminal.draft.purpose.get(),
      ConnectionPurpose::Edit(ref profile)
      if profile.credentials == crate::library::Credentials::Session) }}">
      <p class="connection-hint">Empty keeps prompting for {{ state.client.profile().secret.noun }} when you open this connection.</p>
    </If>
    <If condition="{{ state.terminal.saving_connection() }}">
      <label class="connection-option">
        <input id="remember-credentials" class="connection-checkbox" type="checkbox"
               bind="state.terminal.draft.remember">
        <p class="connection-option-label">Remember {{ state.client.profile().secret.noun }} securely</p>
      </label>
      <p class="connection-hint">Uses the OS credential store. Unchecked: enter {{ state.client.profile().secret.noun }} again when reopening.</p>
    </If>
  </div>
</template>
