[workspace]
members = ["landing", "docs"]
resolver = "2"

[workspace.metadata.fusor.site]
output = "dist"

[workspace.metadata.fusor.site.mounts]
"/" = "sql-bomb-landing"
"/docs/" = "sql-bomb-docs"

[workspace.dependencies]
fusor = { package = "fusor-core", version = "=0.1.4", features = ["dom", "derive"] }
fusor-components = { version = "=0.1.4", features = ["browser"] }
fusor-build = "=0.1.4"
wasm-bindgen = "=0.2.117"

[workspace.dependencies.docs-base]
git = "https://github.com/fusor-rs/docs-base"
rev = "e2c7b3939721002ea2aa7556d8e4409aa131472b"

[workspace.dependencies.docs-base-build]
git = "https://github.com/fusor-rs/docs-base"
rev = "e2c7b3939721002ea2aa7556d8e4409aa131472b"

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
