[package]
name = "sql-bomb-landing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusor.workspace = true
fusor-components.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.67"
web-sys = { version = "=0.3.94", features = ["Window", "Navigator", "Clipboard", "MediaQueryList"] }

[build-dependencies]
fusor-build.workspace = true

[package.metadata.fusor]
entry = "web/index.html"
templates = []
assets = "public"
base-path = "/"

[lints]
workspace = true
